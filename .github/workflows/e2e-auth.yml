name: E2E authentication

on:
  push:
    branches: [test/e2e-auth-playwright]
    paths:
      - "store-admin/**"
      - ".github/workflows/e2e-auth.yml"
  pull_request:
    branches: [main]
    paths:
      - "store-admin/**"
      - ".github/workflows/e2e-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ui-e2e:
    name: UI E2E (Vercel Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_PREVIEW_BASE_URL }}
      E2E_VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel Preview URL
        shell: bash
        run: |
          test -n "$E2E_BASE_URL" || {
            echo "::error::Set the GitHub Actions repository variable E2E_PREVIEW_BASE_URL to this PR's Vercel Preview URL."
            exit 1
          }
          case "$E2E_BASE_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::E2E_PREVIEW_BASE_URL must be an HTTPS Vercel Preview URL."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Run read-only login-screen UI E2E (headless Chromium)
        working-directory: store-admin
        run: npx playwright test e2e/auth.spec.js --grep "màn hình đăng nhập"

      - name: Upload UI HTML report, trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-ui-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
          if-no-files-found: warn
          retention-days: 14

  auth-api-e2e:
    name: API E2E (temporary PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-production-password
          POSTGRES_DB: hungfashion_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hungfashion_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: hungfashion_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-production-password
      POSTGRES_SSL: "false"
      E2E_BASE_URL: http://127.0.0.1:5000
      E2E_CUSTOMER_IDENTIFIER: ${{ secrets.E2E_CUSTOMER_IDENTIFIER }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_STAFF_IDENTIFIER: ${{ secrets.E2E_STAFF_IDENTIFIER }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-disposable-database-2026
      AUTH_RATE_LIMIT_WINDOW_MS: 300000
      AUTH_LOGIN_RATE_LIMIT_MAX: 10
      AUTH_REGISTER_RATE_LIMIT_MAX: 10
      KAFKA_BROKER: localhost:9092
      PORT: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Verify dedicated E2E credentials
        shell: bash
        run: |
          test -n "$E2E_CUSTOMER_IDENTIFIER" || { echo "::error::Missing E2E_CUSTOMER_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_CUSTOMER_PASSWORD" || { echo "::error::Missing E2E_CUSTOMER_PASSWORD GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_IDENTIFIER" || { echo "::error::Missing E2E_STAFF_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_PASSWORD" || { echo "::error::Missing E2E_STAFF_PASSWORD GitHub Secret"; exit 1; }

      - name: Apply schema and migrations to temporary PostgreSQL
        working-directory: store-admin
        run: npm run db:migrate --workspace server

      - name: Seed dedicated E2E customer and staff accounts
        working-directory: store-admin
        run: node server/seed-e2e-auth.js

      - name: Start local API backend
        working-directory: store-admin
        run: |
          nohup npm run start --workspace server > /tmp/hungfashion-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Local API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local API did not become ready."
          cat /tmp/hungfashion-api.log
          exit 1

      - name: Run authentication API E2E
        working-directory: store-admin
        run: npx playwright test e2e/auth-api-ci.spec.js

      - name: Print API log on failure
        if: failure()
        run: cat /tmp/hungfashion-api.log || true

      - name: Upload API HTML report, trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-api-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
            /tmp/hungfashion-api.log
          if-no-files-found: warn
          retention-days: 14
