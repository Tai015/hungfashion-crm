name: E2E authentication

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/**"
      - ".github/workflows/e2e-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ui-e2e:
    name: UI E2E (Vercel Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://hungfashion-crm-git-test-e2e-auth-playwright-tai-4212.vercel.app
      E2E_VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel Preview URL
        shell: bash
        run: |
          test -n "$E2E_BASE_URL" || {
            echo "::error::Set the GitHub Actions repository variable E2E_PREVIEW_BASE_URL to this PR's Vercel Preview URL."
            exit 1
          }
          case "$E2E_BASE_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::E2E_PREVIEW_BASE_URL must be an HTTPS Vercel Preview URL."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Check Vercel Deployment Protection
        shell: bash
        run: |
          if [ -n "$E2E_VERCEL_BYPASS_TOKEN" ]; then
            status=$(curl --silent --show-error --output /tmp/vercel-preview.html --write-out "%{http_code}" \
              --header "x-vercel-protection-bypass: $E2E_VERCEL_BYPASS_TOKEN" "$E2E_BASE_URL/" || true)
          else
            status=$(curl --silent --show-error --output /tmp/vercel-preview.html --write-out "%{http_code}" \
              "$E2E_BASE_URL/" || true)
          fi
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Vercel Preview is protected from headless CI (HTTP $status). Configure VERCEL_AUTOMATION_BYPASS_SECRET with a Vercel Protection Bypass token. Deployment Protection was not disabled."
            exit 1
          fi
          if grep -Eiq 'Log in to Vercel|Security Checkpoint|Authentication Required' /tmp/vercel-preview.html; then
            echo "::error::Vercel Deployment Protection/security challenge is serving its own page instead of the app. Configure VERCEL_AUTOMATION_BYPASS_SECRET with the Vercel-generated automation bypass value; do not disable protection."
            exit 1
          fi
          if [ "$status" != "200" ] || ! grep -q 'id="root"' /tmp/vercel-preview.html; then
            echo "::error::Vercel Preview did not return the expected application HTML (HTTP $status). Check E2E_PREVIEW_BASE_URL and the deployment."
            exit 1
          fi
          echo "Vercel Preview is accessible to the CI browser."

      - name: Run read-only login-screen UI E2E (headless Chromium)
        working-directory: store-admin
        run: npx playwright test e2e/auth.spec.js --grep "màn hình đăng nhập"

      - name: Upload UI HTML report, trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-ui-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
          if-no-files-found: warn
          retention-days: 14

  auth-api-e2e:
    name: API E2E (temporary PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-production-password
          POSTGRES_DB: hungfashion_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hungfashion_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-production-password@127.0.0.1:5432/hungfashion_e2e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: hungfashion_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-production-password
      POSTGRES_SSL: "false"
      E2E_BASE_URL: http://127.0.0.1:5000
      E2E_CUSTOMER_IDENTIFIER: ${{ secrets.E2E_CUSTOMER_IDENTIFIER }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_STAFF_IDENTIFIER: ${{ secrets.E2E_STAFF_IDENTIFIER }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-disposable-database-2026
      AUTH_RATE_LIMIT_WINDOW_MS: 300000
      AUTH_LOGIN_RATE_LIMIT_MAX: 10
      AUTH_REGISTER_RATE_LIMIT_MAX: 10
      KAFKA_BROKER: 127.0.0.1:9092
      PORT: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Verify dedicated E2E credentials
        shell: bash
        run: |
          test -n "$E2E_CUSTOMER_IDENTIFIER" || { echo "::error::Missing E2E_CUSTOMER_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_CUSTOMER_PASSWORD" || { echo "::error::Missing E2E_CUSTOMER_PASSWORD GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_IDENTIFIER" || { echo "::error::Missing E2E_STAFF_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_PASSWORD" || { echo "::error::Missing E2E_STAFF_PASSWORD GitHub Secret"; exit 1; }

      - name: Apply schema and migrations to temporary PostgreSQL
        working-directory: store-admin
        run: npm run db:migrate --workspace server

      - name: Seed dedicated E2E customer and staff accounts
        working-directory: store-admin
        run: node server/seed-e2e-auth.js

      - name: Start local API backend
        working-directory: store-admin
        run: |
          nohup npm run start --workspace server > /tmp/hungfashion-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Local API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local API did not become ready."
          cat /tmp/hungfashion-api.log
          exit 1

      - name: Run authentication API E2E
        working-directory: store-admin
        run: npx playwright test e2e/auth-api.spec.js

      - name: Print API log on failure
        if: failure()
        run: cat /tmp/hungfashion-api.log || true

      - name: Upload API HTML report, trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-api-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
            /tmp/hungfashion-api.log
          if-no-files-found: warn
          retention-days: 14
