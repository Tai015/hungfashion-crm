name: E2E authentication

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/**"
      - "database/schema.sql"
      - "database/migrations/**"
      - ".github/workflows/e2e-auth.yml"
  push:
    branches: [main]
    paths:
      - "store-admin/**"
      - "database/schema.sql"
      - "database/migrations/**"
      - ".github/workflows/e2e-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ui-e2e:
    name: UI E2E (local frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-production-password
          POSTGRES_DB: hungfashion_ui_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hungfashion_ui_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only-not-production-password@127.0.0.1:5432/hungfashion_ui_e2e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: hungfashion_ui_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-production-password
      POSTGRES_SSL: "false"
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-disposable-database-2026
      AUTH_RATE_LIMIT_WINDOW_MS: 300000
      AUTH_LOGIN_RATE_LIMIT_MAX: 10
      AUTH_REGISTER_RATE_LIMIT_MAX: 10
      KAFKA_BROKER: 127.0.0.1:9092
      PORT: 5000
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_CUSTOMER_IDENTIFIER: ${{ secrets.E2E_CUSTOMER_IDENTIFIER }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_STAFF_IDENTIFIER: ${{ secrets.E2E_STAFF_IDENTIFIER }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Verify dedicated UI test credentials
        shell: bash
        run: |
          test -n "$E2E_CUSTOMER_IDENTIFIER" || { echo "::error::Missing E2E_CUSTOMER_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_CUSTOMER_PASSWORD" || { echo "::error::Missing E2E_CUSTOMER_PASSWORD GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_IDENTIFIER" || { echo "::error::Missing E2E_STAFF_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_PASSWORD" || { echo "::error::Missing E2E_STAFF_PASSWORD GitHub Secret"; exit 1; }

      - name: Apply schema and migrations to disposable UI PostgreSQL
        working-directory: store-admin
        run: npm run db:migrate --workspace server

      - name: Seed dedicated E2E customer and staff accounts
        working-directory: store-admin
        run: node server/seed-e2e-auth.js

      - name: Start local API backend
        working-directory: store-admin
        run: |
          nohup npm run start --workspace server > /tmp/hungfashion-ui-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Local API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local API did not become ready."
          cat /tmp/hungfashion-ui-api.log
          exit 1

      - name: Start local Vite frontend
        working-directory: store-admin
        run: |
          nohup npm run dev --workspace client -- --host 127.0.0.1 > /tmp/hungfashion-ui-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              echo "Local Vite frontend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local Vite frontend did not become ready."
          cat /tmp/hungfashion-ui-vite.log
          exit 1

      - name: Verify frontend API proxy
        run: curl --fail --silent http://127.0.0.1:5173/api/health

      - name: Run customer and staff login UI E2E (headless)
        working-directory: store-admin
        run: npx playwright test e2e/auth.spec.js

      - name: Print local service logs on failure
        if: failure()
        run: |
          echo "===== API ====="
          cat /tmp/hungfashion-ui-api.log || true
          echo "===== Vite ====="
          cat /tmp/hungfashion-ui-vite.log || true

      - name: Upload UI Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-ui-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
            /tmp/hungfashion-ui-api.log
            /tmp/hungfashion-ui-vite.log
          if-no-files-found: warn
          retention-days: 14

  auth-api-e2e:
    name: API E2E (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-production-password
          POSTGRES_DB: hungfashion_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hungfashion_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Keep DATABASE_URL only for the standalone E2E seed script.
      DATABASE_URL: postgres://postgres:ci-only-not-production-password@127.0.0.1:5432/hungfashion_e2e
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: hungfashion_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-not-production-password
      POSTGRES_SSL: "false"
      E2E_BASE_URL: http://127.0.0.1:5000
      E2E_CUSTOMER_IDENTIFIER: ${{ secrets.E2E_CUSTOMER_IDENTIFIER }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_STAFF_IDENTIFIER: ${{ secrets.E2E_STAFF_IDENTIFIER }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-disposable-database-2026
      AUTH_RATE_LIMIT_WINDOW_MS: 300000
      AUTH_LOGIN_RATE_LIMIT_MAX: 10
      AUTH_REGISTER_RATE_LIMIT_MAX: 10
      KAFKA_BROKER: 127.0.0.1:9092
      PORT: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Verify dedicated test credentials
        shell: bash
        run: |
          test -n "$E2E_CUSTOMER_IDENTIFIER" || { echo "::error::Missing E2E_CUSTOMER_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_CUSTOMER_PASSWORD" || { echo "::error::Missing E2E_CUSTOMER_PASSWORD GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_IDENTIFIER" || { echo "::error::Missing E2E_STAFF_IDENTIFIER GitHub Secret"; exit 1; }
          test -n "$E2E_STAFF_PASSWORD" || { echo "::error::Missing E2E_STAFF_PASSWORD GitHub Secret"; exit 1; }

      - name: Apply schema and migrations to disposable PostgreSQL
        working-directory: store-admin
        run: npm run db:migrate --workspace server

      - name: Seed dedicated E2E customer and staff accounts
        working-directory: store-admin
        run: node server/seed-e2e-auth.js

      - name: Start local API backend
        working-directory: store-admin
        run: |
          nohup npm run start --workspace server > /tmp/hungfashion-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Local API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local API did not become ready."
          cat /tmp/hungfashion-api.log
          exit 1

      - name: Run authentication API E2E
        working-directory: store-admin
        run: npx playwright test e2e/auth-api.spec.js

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/hungfashion-api.log || true

      - name: Upload API Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-api-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
            /tmp/hungfashion-api.log
          if-no-files-found: warn
          retention-days: 14


  auth-preview-e2e:
    name: UI E2E (deployed Vercel Preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_PREVIEW_BASE_URL }}
      E2E_VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Preview URL and Vercel bypass secret
        shell: bash
        run: |
          test -n "$E2E_BASE_URL" || { echo "::error::Missing repository variable E2E_PREVIEW_BASE_URL (the stable Vercel Preview URL for this PR branch)."; exit 1; }
          test -n "$E2E_VERCEL_BYPASS_TOKEN" || { echo "::error::Missing repository secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel Deployment Protection automation bypass)."; exit 1; }
          case "$E2E_BASE_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::E2E_PREVIEW_BASE_URL must be an HTTPS Vercel Preview URL."; exit 1 ;;
          esac
          echo "Preview URL configuration is present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview to become accessible
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --header "x-vercel-protection-bypass: $E2E_VERCEL_BYPASS_TOKEN" \
              "$E2E_BASE_URL/" --output /tmp/hungfashion-preview.html 2>/dev/null; then
              if grep -q 'id="root"' /tmp/hungfashion-preview.html; then
                echo "Vercel Preview is serving the application."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Vercel Preview did not become accessible or did not serve the application within 10 minutes. Check Vercel deployment status, E2E_PREVIEW_BASE_URL, and VERCEL_AUTOMATION_BYPASS_SECRET."
          exit 1

      - name: Run read-only login-screen UI E2E on Preview
        working-directory: store-admin
        run: npx playwright test e2e/auth.spec.js --grep "màn hình đăng nhập"

      - name: Upload Preview Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-preview-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
          if-no-files-found: warn
          retention-days: 14

  production-smoke-e2e:
    name: Production smoke E2E (read-only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://hungfashion-crm.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright test runner
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Wait for Production frontend and API
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$E2E_BASE_URL/" --output /tmp/hungfashion-production.html \
              && grep -q 'id="root"' /tmp/hungfashion-production.html \
              && curl --fail --silent "$E2E_BASE_URL/api/health" --output /tmp/hungfashion-production-health.json \
              && grep -q '"status":"ok"' /tmp/hungfashion-production-health.json; then
              echo "Production frontend and API health endpoint are responding."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not become healthy within 10 minutes. Check Vercel deployment and Render backend health."
          exit 1

      - name: Run read-only Production UI and API smoke E2E
        working-directory: store-admin
        run: npx playwright test e2e/auth.spec.js e2e/production-smoke.spec.js --grep-invert "đăng nhập thành công"

      - name: Upload Production smoke report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-playwright-report
          path: |
            store-admin/playwright-report/
            store-admin/test-results/
          if-no-files-found: warn
          retention-days: 14
