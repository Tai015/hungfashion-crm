name: Frontend production build

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/client/**"
      - "store-admin/package.json"
      - "store-admin/package-lock.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix store-admin

      - name: Build frontend for production
        run: npm run build --prefix store-admin

      - name: Report generated JavaScript chunk sizes
        shell: bash
        run: |
          find store-admin/client/dist/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' \
            | sort -nr \
            | awk '{ printf "%7.1f KiB  %s\n", $1 / 1024, $2 }'

  auth-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        run: npm ci --prefix store-admin

      - name: Install Playwright
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Run authentication UI E2E
        working-directory: store-admin
        run: npx playwright test --config=playwright.auth.config.js

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-sweetalert-playwright-report
          path: |
            store-admin/test-results/
            store-admin/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
