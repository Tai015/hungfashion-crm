name: Frontend production build

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/client/**"
      - "store-admin/package.json"
      - "store-admin/package-lock.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix store-admin

      - name: Build frontend for production
        run: npm run build --prefix store-admin

      - name: Report generated JavaScript chunk sizes
        shell: bash
        run: |
          find store-admin/client/dist/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' \
            | sort -nr \
            | awk '{ printf "%7.1f KiB  %s\n", $1 / 1024, $2 }'
