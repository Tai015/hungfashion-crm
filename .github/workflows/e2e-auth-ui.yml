name: Auth SweetAlert UI E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/client/src/AuthScreen.jsx"
      - "store-admin/e2e/auth-ui.spec.js"
      - "store-admin/playwright.auth.config.js"
      - "store-admin/client/**"
      - ".github/workflows/e2e-auth-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install project dependencies
        working-directory: store-admin
        run: npm ci

      - name: Install Playwright
        working-directory: store-admin
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        working-directory: store-admin
        run: npx playwright install --with-deps chromium

      - name: Run authentication UI E2E
        working-directory: store-admin
        run: npx playwright test --config=playwright.auth.config.js

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-sweetalert-playwright-report
          path: |
            store-admin/test-results/
            store-admin/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
