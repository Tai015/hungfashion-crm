name: Skylos PR review

on:
  pull_request:
    branches: [main]
    paths:
      - "store-admin/**"
      - "pyproject.toml"
      - ".github/workflows/skylos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skylos-review:
    name: Skylos static analysis and Done review (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skylos-ci-only-password
          POSTGRES_DB: hungfashion_skylos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hungfashion_skylos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:skylos-ci-only-password@127.0.0.1:5432/hungfashion_skylos_test
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store-admin/package-lock.json

      - name: Install pinned Skylos verifier
        run: python -I -m pip install "skylos==4.47.2"

      - name: Install Hung Fashion dependencies
        run: npm ci --prefix store-admin

      - name: Analyze code (advisory during initial rollout)
        continue-on-error: true
        run: skylos . -a

      - name: Check whether the PR is finished (advisory during initial rollout)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          if git show "${base_ref}:pyproject.toml" 2>/dev/null | grep -Fq '[tool.skylos.done]'; then
            skylos done --base "$base_ref"
          else
            echo "::notice::Skylos Done is skipped for the bootstrap PR. It reads trusted settings from the base branch; subsequent PRs will run the configured Node.js test suite."
          fi

      - name: Upload Skylos receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skylos-review-receipts
          path: .skylos/receipts/
          if-no-files-found: ignore
          retention-days: 14
