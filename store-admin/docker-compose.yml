services:
  postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in server/.env}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in server/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in server/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.3.1
    container_name: store-kafka
    hostname: broker
    restart: unless-stopped
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: store-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - '127.0.0.1:${KAFKA_UI_PORT:?Set KAFKA_UI_PORT in server/.env}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: store-admin-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092

volumes:
  postgres_data:
  kafka_data:
